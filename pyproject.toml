[project]
name = "diet-planner"
version = "0.1.0"
description = "Daily diet planner built with Google ADK, MCP and A2A"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-adk[a2a,eval,otel]>=2.13.0",
    "litellm>=1.96.2",
    "mcp[cli]>=2.3.0",
    "opentelemetry-instrumentation-fastapi>=0.65b0",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "pytest>=9.0",
    "pytest-asyncio>=1.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
