global:
  scrape_interval: 10s
  evaluation_interval: 30s

# SLIs and alerts (see prometheus/diet-planner.rules.yml).
rule_files:
  - /etc/prometheus/rules/diet-planner.rules.yml

# Firing alerts go to Alertmanager, which sends them to Slack (alertmanager/alertmanager.yml).
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]
