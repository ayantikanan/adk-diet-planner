# =====================================================================
#  MCP tool server - its address and every tool it serves.
#  Edit this file to change a tool's description or numbers;
#  restart the server afterwards.
# =====================================================================

name: diet-tools
instructions: "Tools for planning a daily diet: calorie targets and meal ideas."
host: 127.0.0.1
port: 8002                  # 8000 = orchestrator (adk web), 8001 = A2A agents

tools:

  calculate_daily_calories:
    description: |
      Calculates a daily calorie and macro target (Mifflin-St Jeor equation).

      Args:
          age: Age in years.
          sex: "male" or "female".
          weight_kg: Body weight in kilograms.
          height_cm: Height in centimetres.
          activity: One of "sedentary", "light", "moderate", "active".
          goal: One of "lose", "maintain", "gain".
    activity_levels:          # multipliers for the Mifflin-St Jeor equation
      sedentary: 1.2
      light: 1.375
      moderate: 1.55
      active: 1.725
    goal_adjustment:          # calories added/removed per day for each goal
      lose: -500
      maintain: 0
      gain: 300
    min_calories:             # safety floor: never plan below these
      male: 1500
      female: 1200
    macro_split:              # share of calories from each macro
      protein: 0.30
      carbs: 0.40
      fat: 0.30

  get_meal_options:
    description: |
      Returns meal ideas for one meal of the day, with calories and
      macros (protein_g, carbs_g, fat_g), lowest calories first.

      Args:
          meal_type: One of "breakfast", "lunch", "dinner", "snack".
          vegetarian: If true, only vegetarian options are returned.
          avoid_allergens: Allergens to leave out. Any of "dairy", "eggs", "fish",
            "shellfish", "gluten", "nuts", "peanuts", "soy", "sesame".
            Always pass the user's allergies here.
          dislikes: Foods the user doesn't want, e.g. ["mushroom", "tofu"]. Meals whose
            name or ingredients contain them are left out.

      Each option lists its ingredients and allergens. If "options" is empty,
      no meal of that type is safe for these filters: tell the user.
    # Meals live in a SQLite database, built from the seed file on first run.
    # Rebuild after editing the seed: uv run python -m mcp_server.db --rebuild
    database: data/diet.db            # paths are relative to mcp_server/
    schema_file: data/schema.sql
    seed_file: data/seed_meals.json
    max_options: 12                   # most options returned per meal type

  build_week_menu:
    description: |
      Builds a 7-day menu (Monday to Sunday): one breakfast, lunch, dinner and
      snack per day, each day's total as close as possible to daily_calories,
      with as few repeated dishes as possible. Portions are scaled (0.75x to 1.5x)
      when needed to reach the target; "portion" says by how much. Use it when the
      user wants a weekly plan. Numbers are exact; use them as they are.

      Args:
          daily_calories: The daily target from calculate_daily_calories.
          vegetarian: If true, only vegetarian dishes.
          avoid_allergens: The user's allergies (same names as get_meal_options).
          dislikes: Foods the user doesn't want.

      Returns days[] with meals and total_calories, and all_dishes: the list of
      every dish used in the week (send it to grocery_agent).
