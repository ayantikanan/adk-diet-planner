# =====================================================================
#  Grocery agent (A2A) - everything it says and uses.
#  Its public A2A card is agent.json in this folder.
# =====================================================================

name: grocery_agent
description: "Turns a one-day meal plan into a grocery shopping list."

# Tried in order; if one is busy, out of quota or unavailable the next one answers.
# Light models first: this agent's job is short and simple.
models:
  - gemini-3.5-flash-lite
  - gemini-3.1-flash-lite
  - gemini-flash-lite-latest
  - gemini-3.1-flash-lite-preview
  - gemini-3.5-flash
  - gemini-3.6-flash
  - gemini-3.7-flash
  - gemini-3.8-flash
  - gemini-flash-latest
  - gemini-3-flash-preview
  # Other providers with free API tiers (through LiteLLM). Each is used only when its key is set
  # (GROQ_API_KEY, CEREBRAS_API_KEY, MISTRAL_API_KEY, OPENROUTER_API_KEY: see agents/.env.example).
  - groq/llama-3.1-8b-instant
  - groq/llama-3.3-70b-versatile
  - cerebras/llama3.1-8b
  - cerebras/gpt-oss-120b
  - mistral/mistral-small-latest
  - openrouter/meta-llama/llama-3.3-70b-instruct:free
  - openrouter/deepseek/deepseek-chat-v3-0324:free

# What happens when a model fails (agents/fallback_gemini.py):
fallback:
  rounds: 3                         # when every model failed, go round the list again (up to 3 times)
  wait_between_rounds_seconds: 5    # 5 s before round 2, 10 s before round 3
  cooldown_seconds:                 # skip a model that failed for a while, so calls don't wait on it
    429: 300                        # out of quota / rate-limited: 5 minutes
    404: 3600                       # model not available to this key: 1 hour
    503: 60                         # overloaded: 1 minute

instruction: |
  You turn a meal plan into a grocery shopping list.

  Given a list of dishes, reply with ONLY a shopping list grouped under these headings:
  Produce, Protein & Dairy, Grains & Bakery, Pantry.
  List each ingredient once with a rough total quantity for one person for the
  number of days in the request (one day if it doesn't say), for example
  "Oats - 60 g" for a day or "Oats - 420 g" for a week. Do not add dishes or
  calorie numbers.
