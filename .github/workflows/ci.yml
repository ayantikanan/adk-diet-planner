# CI: runs on every push to main and every pull request.
# 1. Lint + tests (no API key needed)  2. Docker image builds
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Lint and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"
          enable-cache: true

      - name: Install Python and dependencies
        run: uv sync --frozen

      - name: Lint (syntax errors and undefined names)
        run: uvx ruff check --select E9,F63,F7,F82 .

      - name: Tests
        run: uv run pytest -q

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t diet-planner:ci .
